# task.toml normalized to clibench template (260910); original extra fields preserved
version = "1.0"
artifacts = ["/workspace/report.docx", "/workspace/generated_code.py"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "word_lbo_returns_report"
difficulty = "hard"
category = "Office Suite"
subcategory = "Document Writer"
name = "lbo-returns-report"
description = "LBO Investment Return Analysis Report — Excel to Word"

[verifier]
environment_mode = "separate"

[verifier.env]
JUDGE_API_BASE = "${JUDGE_API_BASE}"
JUDGE_API_KEY = "${JUDGE_API_KEY}"
JUDGE_MODEL = "claude-sonnet-4-6"

[environment]
docker_image = "bingliwang/clibench-env-task-level:word_lbo_returns_report"
allow_internet = false

[verifier.environment]
docker_image = "bingliwang/clibench-verifier-task-level:word_lbo_returns_report"
allow_internet = false
