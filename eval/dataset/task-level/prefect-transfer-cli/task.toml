version = "1.0"

artifacts = ["/app", "/workspace"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "prefect-transfer-cli"
difficulty = "hard"
source_repo = "PrefectHQ/prefect"
source_commit = "fe7b84c9f7c5aae03463def73507a15421eb22fb"
category = "System Operations"
subcategory = "Task Scheduling"

[verifier]
timeout_sec = 1800.0
# "shared": verify in place in the agent sandbox. In separate mode the
# artifact transfer leg flattens permission bits to 644, so the agent-built
# /app/.venv/bin/prefect entrypoint loses its executable bit and
# shutil.which("prefect") (PREFECT_BIN) resolves to nothing.
environment_mode = "shared"

[agent]
timeout_sec = 14400.0

[environment]
docker_image = "bingliwang/clibench-env-task-level:prefect-transfer-cli"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 30720
