version = "1.0"

artifacts = ["/app", "/workspace"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "desc-state-repair"
difficulty = "hard"
category = "Data Analysis"
subcategory = "Data Cleaning"

[verifier]
timeout_sec = 360.0
environment_mode = "separate"

[agent]
timeout_sec = 1800.0

[environment]
docker_image = "bingliwang/clibench-env-task-level:desc-state-repair"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

[verifier.environment]
docker_image = "bingliwang/clibench-verifier-task-level:desc-state-repair"
workdir = "/app"
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
