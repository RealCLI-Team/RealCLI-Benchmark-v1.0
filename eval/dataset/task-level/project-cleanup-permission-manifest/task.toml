version = "1.0"

artifacts = ["/app", "/workspace"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "project-cleanup-permission-manifest"
difficulty = "hard"
category = "System Operations"
subcategory = "Permission Management"

[verifier]
timeout_sec = 300.0
# "shared": verify in place in the agent sandbox. The separate-mode artifact
# transfer leg flattens permission bits to 644, which this task's verifier
# asserts on (mode 777 fixtures), so a fresh verifier sandbox cannot score it.
environment_mode = "shared"

[agent]
timeout_sec = 3600.0

[environment]
docker_image = "bingliwang/clibench-env-task-level:project-cleanup-permission-manifest"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 5120
