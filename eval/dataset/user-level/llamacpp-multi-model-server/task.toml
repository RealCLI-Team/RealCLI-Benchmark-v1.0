version = "1.0"

artifacts = ["/app/common", "/app/src", "/app/tools", "/app/CMakeLists.txt"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "llamacpp-multi-model-server"
difficulty = "hard"
source_repo = "ggml-org/llama.cpp"
source_commit = "773340973473952df872b179f97b5a484a0b063d"
category = "Models & Algorithms"
subcategory = "Inference Deployment"

[verifier]
