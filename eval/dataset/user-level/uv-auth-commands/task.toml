version = "1.0"

artifacts = [{ source = "/app", exclude = ["target", "target/**"] }, "/workspace"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "uv-auth-commands"
difficulty = "hard"
source_repo = "astral-sh/uv"
source_commit = "36216363eb08af2ad3fe522caac3b4fe10311a15"
category = "System Operations"
subcategory = "Environment & Dependencies"

[verifier]
timeout_sec = 1800.0
environment_mode = "shared"

[agent]
timeout_sec = 14400.0

[environment]
docker_image = "bingliwang/clibench-env-user-level:uv-auth-commands"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 30720

# CliBench: user simulator driven by interaction/script.json.
[environment.env]
CARGO_INCREMENTAL = "0"

[user_simulation]
enabled = true
script_path = "interaction/script.json"
max_turns = 100
max_tokens = 8192
stop_phrases = ["#### STOP"]
