version = "1.0"

artifacts = [{source = "/app", exclude = ["target", "target/**"]}, "/workspace"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "tgi-scheduler-v3"
difficulty = "hard"
source_repo = "huggingface/text-generation-inference"
source_commit = "fec0167a123eddc60891320dd263e974671ad1c9"
category = "Models & Algorithms"
subcategory = "Inference Deployment"

[verifier]
timeout_sec = 1800.0
environment_mode = "shared"

[agent]
timeout_sec = 14400.0

[environment]
docker_image = "bingliwang/clibench-env-user-level:tgi-scheduler-v3"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 30720

# CliBench: user simulator driven by interaction/script.json.
[user_simulation]
enabled = true
script_path = "interaction/script.json"
max_turns = 100
max_tokens = 8192
stop_phrases = ["#### STOP"]
