# task.toml normalized to clibench template (260910); original extra fields preserved
version = "1.0"
artifacts = ["/mangrove-swamp-experience_0110", "/app"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "mangrove-swamp-experience"
difficulty = "hard"
category = "Frontend Build"
subcategory = "Interactive Experience"
benchmark = "frontend-build-eval-0731"
