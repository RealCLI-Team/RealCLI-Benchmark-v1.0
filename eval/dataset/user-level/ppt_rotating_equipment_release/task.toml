network_required = false

[verifier]
timeout_sec = 3900.0
environment_mode = "shared"
user = "root"

[verifier.env]
CLIBENCH_TASK_ID = "ppt_01_rotating_equipment_release"
CLIBENCH_PROFESSION = "mechanical_engineering_technicians"
CLIBENCH_EVALUATED_MODEL = "${CLIBENCH_EVALUATED_MODEL}"
JUDGE_API_BASE = "${JUDGE_API_BASE}"
