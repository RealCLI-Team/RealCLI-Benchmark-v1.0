JUDGE_MODEL = "claude-sonnet-4-6"
CLIBENCH_JUDGE_THINKING_DISABLED = "${CLIBENCH_JUDGE_THINKING_DISABLED:-1}"
CLIBENCH_JUDGE_WORKERS = "${CLIBENCH_JUDGE_WORKERS:-64}"
CLIBENCH_JUDGE_MAX_COMPLETION_TOKENS = "${CLIBENCH_JUDGE_MAX_COMPLETION_TOKENS:-32768}"
CLIBENCH_JUDGE_MAX_RETRIES = "${CLIBENCH_JUDGE_MAX_RETRIES:-6}"
CLIBENCH_VISUAL_JUDGE_MODEL = "claude-sonnet-4-6"

[agent]
timeout_sec = 7200.0
user = "clibench"
num_turns = 1

[environment]
docker_image = "bingliwang/clibench-env-user-level:ppt_rotating_equipment_release"
cpus = 4
memory_mb = 8192
storage_mb = 51200
workdir = "/workspace"
network_mode = "public"

[[artifacts]]
source = "/workspace/model_output"
destination = "model_output"

# CliBench: user simulator driven by interaction/script.json.
[user_simulation]
enabled = true
script_path = "interaction/script.json"
max_turns = 100
max_tokens = 8192
stop_phrases = ["#### STOP"]
