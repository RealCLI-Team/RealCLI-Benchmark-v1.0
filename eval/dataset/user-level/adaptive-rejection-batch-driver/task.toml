version = "1.0"

artifacts = ["/app"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "adaptive-rejection-batch-driver"
difficulty = "hard"
category = "Science & Computing"
subcategory = "Mathematical Proof"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

[environment]
docker_image = "bingliwang/clibench-env-user-level:adaptive-rejection-batch-driver"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 30720

[verifier.environment]
docker_image = "bingliwang/clibench-verifier-user-level:adaptive-rejection-batch-driver"
# Built from tests/Dockerfile.
workdir = "/app"
cpus = 4
memory_mb = 16384
storage_mb = 30720
gpus = 0

# CliBench: user simulator driven by interaction/script.json.
[user_simulation]
enabled = true
script_path = "interaction/script.json"
max_turns = 100
max_tokens = 8192
stop_phrases = ["#### STOP"]
