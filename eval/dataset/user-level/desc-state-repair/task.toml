version = "1.0"

artifacts = ["/app"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "desc-state-repair"
difficulty = "hard"
category = "Data Analysis"
subcategory = "Data Cleaning"

[verifier]
timeout_sec = 360.0

[agent]
timeout_sec = 1800.0

[environment]
docker_image = "bingliwang/clibench-env-user-level:desc-state-repair"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240


[user_simulation]
enabled = true
script_path = "interaction/script.json"
max_turns = 100
max_tokens = 8192
stop_phrases = ["#### STOP"]
