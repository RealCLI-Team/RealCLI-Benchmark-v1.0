version = "1.0"

artifacts = ["/app"]

[metadata]
author_name = "clibench"
author_email = "clibench@example.com"
task_id = "ollama-agent-harness"
difficulty = "hard"
source_repo = "ollama/ollama"
source_commit = "624cada952c87bcf1f0e7d00b669f0cc483103eb"
category = "Models & Algorithms"
subcategory = "Inference Deployment"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

[environment]
docker_image = "bingliwang/clibench-env-user-level:ollama-agent-harness"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 30720

[verifier.environment]
docker_image = "bingliwang/clibench-verifier-user-level:ollama-agent-harness"
workdir = "/app"
cpus = 4
memory_mb = 16384
storage_mb = 30720
gpus = 0

# CliBench: user simulator driven by interaction/script.json.
[user_simulation]
enabled = true
script_path = "interaction/script.json"
max_turns = 100
max_tokens = 8192
stop_phrases = ["#### STOP"]
